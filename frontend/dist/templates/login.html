<main class="form">
    <section class="container">
        <article class="form-content">
            <h1 class="form-title common-title"><span>Вход</span> в систему</h1>
            <section class="form-details">
                <article class="form-group">
                    <input type="text" class="form-input" id="email" required>
                    <label for="email" class="form-label">Электронная почта</label>
                </article>
                <article class="form-group">
                    <input type="password" class="form-input" id="password" required>
                    <label for="password" class="form-label">Пароль</label>
                </article>
            </section>
            <section class="form-button">
                <button class="button" id="process" disabled>Перейти к выбору теста</button>
            </section>
            <section class="form-link">Нет аккаунта? <a href="/#/signup">Зарегистрироваться</a></section>
        </article>
        <picture class="form-image">
            <img src="../static/image/Info-image.png" alt="Персонаж">
        </picture>
    </section>
</main>
